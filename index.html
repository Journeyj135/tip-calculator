<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="styles.css" />
    <title>Tip Caluculator</title>
  </head>
  <body>
    <div class="container">
      <div class="container2">
        <h3 id="header">Tip Calculator</h3>
        <h6>
          Enter the bill amount and tip percentage to calculate the total.
        </h6>
        <h6>Bill Amount:</h6>
        <input id="cash_amount" type="number" autofocus="on" />
        <h6>Tip Percentage:</h6>
        <input id="tip" type="number" />
        <br />
        <button id="calculator">CALCULATE</button>
        <h6 id="total">Total:</h6>
        <p id="tip_total"></p>
      </div>
    </div>
  </body>
</html>
